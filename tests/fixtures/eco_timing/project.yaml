# A registered 12 x 12 multiplier placed without regard to timing and routed without timing
# repair, so it misses timing at the slow corner until an ECO's repair: setup
# (tests/test_project_eco.py). Placed for timing on LibreLane 3.0.14, the margins were thin:
# at 5.4 to 5.8 ns it missed by 0.31 to 0.18 ns and the repair ended at -0.13 to +0.20 ns.
# Here it misses by about 0.8 ns and the repair leaves about 0.4 ns. PL_TIME_DRIVEN is the
# name LibreLane 3.0.0.dev44 and 3.0.14 both read. Its multiplier is a power domain at another
# voltage, which IHP's cells cannot cross (tests/test_project_upf.py).
schema: project/v1
name: eco_timing
top: mac
sources: [rtl/mul.sv, rtl/mac.sv]
clocks: [{port: clk_i, period_ns: 6.2}]
resets: [{port: rst_ni, active: low}]
tech: ihp-sg13g2
pnr:
  librelane: {PL_TIME_DRIVEN: false, RUN_POST_CTS_RESIZER_TIMING: false, RUN_POST_GRT_RESIZER_TIMING: false}
eco:
  - {repair: setup}
upf:
  domains:
    - {name: PD_TOP, voltage: 1.2}
    - {name: PD_MUL, elements: [u_mul], voltage: 1.08}
