[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "chipleap"
dynamic = ["version"]
description = "From a spec or from your RTL to GDS: architecture exploration with an explainable agent, an X-HEEP accelerator generator, and lint, cocotb simulation, coverage, synthesis and place and route for any RTL."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Daniel Tyukov" }]
keywords = [
  "design-space-exploration",
  "hardware-architecture",
  "risc-v",
  "x-heep",
  "llm",
  "accelerator",
  "mcp",
  "eda",
  "rtl",
  "cocotb",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = ["pyyaml>=6.0.3", "mcp>=2.3.0", "tomli>=2.5.0; python_version < '3.11'"]

[project.optional-dependencies]
xheep = ["hjson>=3.1.0", "mako>=1.4.3"]
rtl = ["cocotb>=2.1.0"]
dev = [
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.1",
  "mypy>=2.4.0",
  "types-PyYAML",
  "hjson>=3.1.0",
  "mako>=1.4.3",
  "cocotb>=2.1.0",
  "tomli>=2.5.0",
  "jsonschema>=4",
]
site = ["pillow>=12.3.0"]

[project.scripts]
chipleap = "chipleap.cli:main"

[project.urls]
Homepage = "https://danieltyukov.github.io/chipleap/"
Source = "https://github.com/danieltyukov/chipleap"
Issues = "https://github.com/danieltyukov/chipleap/issues"
Changelog = "https://github.com/danieltyukov/chipleap/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/chipleap/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chipleap"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "rtl: needs Verilator (skipped when it is not installed)",
  "synth: needs Yosys (skipped when it is not installed)",
  "xheep: needs an X-HEEP checkout in CHIPLEAP_XHEEP_DIR",
  "pnr: needs LibreLane and CHIPLEAP_RUN_PNR=1 (runs for many minutes)",
  "commercial: needs a commercial simulator or synthesis tool on the path",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
files = ["src/chipleap"]
# KLayout runs these with its own Python and its pya module.
exclude = ["src/chipleap/chip/klayout/"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["mcp.*", "cocotb_tools.*"]
ignore_missing_imports = true
