name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy
      - run: pytest -m "not rtl"
      - name: Smoke the CLI
        run: |
          chipleap --version
          chipleap require -m llama-3.2-1b -t 5
          chipleap explore examples/smollm2-135m-open-pdk.yaml --samples 300 -o out
          chipleap verify out --steps consistency

  hardware:
    name: RTL simulation and X-HEEP
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SV2V_VERSION: v0.0.13
      # The open IHP PDK commit whose typical-corner liberty the RTL project tests
      # synthesize to; only that file is fetched, nothing is committed.
      IHP_PDK_COMMIT: 22f2a25f1734796de3debbbf29cf697cbbc54081
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Verilator, Yosys (with its headers for EQY) and Icarus
        run: sudo apt-get update && sudo apt-get install -y verilator yosys yosys-dev iverilog
      - name: Install sv2v
        run: |
          curl -sSL -o sv2v.zip https://github.com/zachjs/sv2v/releases/download/${SV2V_VERSION}/sv2v-Linux.zip
          unzip -q sv2v.zip && sudo install sv2v-Linux/sv2v /usr/local/bin/sv2v
      - run: pip install -e ".[dev,xheep]"
      # SymbiYosys and EQY are Python scripts that start with "#!/usr/bin/env python3",
      # which is this job's Python, so click goes there.
      - name: Install SymbiYosys, EQY and z3 4.15 (formal, equivalence) and Icarus 13 (gate level)
        run: |
          pip install click
          scripts/install_formal_tools.sh "$RUNNER_TEMP/yosyshq"
          scripts/install_iverilog13.sh "$RUNNER_TEMP/iverilog-13"
          {
            echo "CHIPLEAP_SBY=$RUNNER_TEMP/yosyshq/bin/sby"
            echo "CHIPLEAP_EQY=$RUNNER_TEMP/yosyshq/bin/eqy"
            echo "CHIPLEAP_IVERILOG=$RUNNER_TEMP/iverilog-13/bin/iverilog"
          } >> "$GITHUB_ENV"
      - name: RTL tests
        run: pytest tests/test_rtl.py tests/test_gen.py tests/test_commercial.py -v
      - name: Generate, lint, simulate and check a design with X-HEEP
        run: |
          chipleap explore examples/llama-3.2-1b-decode.yaml --samples 300 -o out
          chipleap verify out --steps consistency,lint,sim,xheep --fetch-xheep
      - name: X-HEEP accepts every bus and accelerator configuration
        run: pytest tests/test_xheep.py -v
      # Gate-level simulation finds the cell models in verilog/ beside the liberty's lib/.
      - name: Fetch the IHP SG13G2 typical-corner liberty and cell models
        run: |
          cells="$RUNNER_TEMP/ihp/sg13g2_stdcell"
          url="https://raw.githubusercontent.com/IHP-GmbH/IHP-Open-PDK/${IHP_PDK_COMMIT}/ihp-sg13g2/libs.ref/sg13g2_stdcell"
          mkdir -p "$cells/lib" "$cells/verilog"
          curl -sSfL -o "$cells/lib/sg13g2_stdcell_typ_1p20V_25C.lib" "$url/lib/sg13g2_stdcell_typ_1p20V_25C.lib"
          for f in sg13g2_stdcell.v sg13g2_udp.v; do
            curl -sSfL -o "$cells/verilog/$f" "$url/verilog/$f"
          done
          echo "CHIPLEAP_LIBERTY=$cells/lib/sg13g2_stdcell_typ_1p20V_25C.lib" >> "$GITHUB_ENV"
      - name: RTL projects (cocotb, lint, synthesis, formal, CDC, equivalence, gate level)
        run: pytest tests/test_project*.py tests/test_vcd.py tests/test_tool_path.py -v
      - name: Verify the example RTL project
        run: chipleap verify examples/uart --steps lint,sim,formal,cdc,synth,equiv
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundle
          path: |
            out/
            examples/uart/build/verify/
