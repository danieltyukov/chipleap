name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - name: Check the version matches the tag
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/chipleap/__init__.py').read()).group(1))")
          test "v${version}" = "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: notes.md
          files: dist/*

  pypi:
    # Trusted publishing: PyPI accepts this workflow's OIDC token, so no API token is
    # stored anywhere. The project's publisher on pypi.org names this repository, this
    # workflow file and the `pypi` environment.
    name: PyPI
    needs: build
    # Off until the repository variable PUBLISH_PYPI is "true", set once the publisher is
    # registered on pypi.org, so a release never fails for want of it.
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/chipleap
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
